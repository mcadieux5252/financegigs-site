# Publishes the Hiring Trends pages (scripts/hiring-trends.mjs) and the blog posts whose day has come (scripts/blog.mjs) every day, after the app's daily snapshot run at
# 13:17 UTC: builds them from the app's public data and commits them only when something changed. The commit is what
# makes Netlify deploy the site, so a newly approved month goes live within the day with no build hook or key.
name: Hiring Trends

on:
  # GitHub runs scheduled workflows late or skips them when busy (Nov 15: 5.5 hours late, Nov 16: not by 14:40 UTC),
  # so two backup times at quiet minutes. A run with nothing new commits nothing.
  schedule:
    - cron: '5 14 * * *'
    - cron: '37 17 * * *'
    - cron: '43 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hiring-trends
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the Hiring Trends pages and the blog
        run: node scripts/hiring-trends.mjs
      - name: Commit them if they changed
        id: commit
        run: |
          git add hiring-trends hiring-trends.html sitemap.xml blog.html llms.txt $( [ -d blog ] && echo blog )
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "hiring-trends-bot"
          git config user.email "hiring-trends-bot@users.noreply.github.com"
          git commit -m "Hiring Trends and blog: refresh the built pages"
          git push
      - name: Tell search engines about the new pages (IndexNow)
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/indexnow.mjs
